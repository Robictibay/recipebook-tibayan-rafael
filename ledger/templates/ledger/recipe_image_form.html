{% extends "base.html" %}

{% block page_heading %}Upload Recipe Image{% endblock %}

{% block content %}
    <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Upload Image</button>
    </form>
    
    <p><a href="{% url 'recipe-detail' view.kwargs.pk %}">Cancel and go back to Recipe</a></p>
{% endblock %}
