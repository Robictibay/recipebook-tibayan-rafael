<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{{ title }}</title>
</head>
<body>
    <h1>{{ title }}</h1>
    <h2>Recipes</h2>
    <ul>
        {% for recipe in recipes %}
            <li><a href="{{ recipe.link }}">{{ recipe.name }}</a></li>
        {% endfor %}
    </ul>
</body>
</html>
