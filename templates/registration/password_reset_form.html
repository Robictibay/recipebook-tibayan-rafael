{% extends "base.html" %}

{% block page_heading %}Reset Password{% endblock %}

{% block content %}
    <p>Forgotten your password? Enter your email address below, and we'll email instructions for setting a new one.</p>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Send Email</button>
    </form>
{% endblock %}
